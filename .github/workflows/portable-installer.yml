name: Portable installer validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      DELEGUARD_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/portable-validation
      DELEGUARD_PORTABLE_RUNTIME: ${{ github.workspace }}/artifacts/portable-build/${{ matrix.rid }}/DeleGuard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m unittest discover -s integrations/ide -p "test_*.py"
      - run: python scripts/build-portable-installer.py
      - run: dotnet test tests/Deleguard.Desktop.Tests --logger "trx;LogFileName=portable.trx" --results-directory artifacts/portable-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-validation-${{ matrix.rid }}
          path: |
            artifacts/portable-validation/*.trx
            artifacts/portable-validation/*.png
    # Deliberately no release upload: signing and native acceptance are mandatory.
