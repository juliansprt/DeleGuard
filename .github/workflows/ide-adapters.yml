name: IDE adapter contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s integrations/ide -p "test_*.py" -v
