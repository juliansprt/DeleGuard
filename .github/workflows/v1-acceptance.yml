name: v1 acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend, security and integration
        shell: pwsh
        run: ./scripts/v1/verify.ps1
      - name: Identify source
        if: always()
        shell: pwsh
        run: ./scripts/v1/source-manifest.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-acceptance-${{ github.sha }}
          path: |
            artifacts/v1-acceptance/
            artifacts/source-manifest.json
            tests/**/TestResults/*.trx
    # Native signing, clean-device acceptance and deployment/restore remain separate release gates.
