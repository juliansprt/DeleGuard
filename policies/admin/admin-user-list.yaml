id: admin-user-list
version: 1
priority: 80
match:
  action: admin.user.list
  resource_type: user
rules:
  - name: deny-foreign-agent
    when:
      field: agent.id
      op: ne
      value: admin-mcp
    effect: DENY
    reason: Administration actions are bound to the admin-mcp agent
  - name: allow-entitled-roles
    when:
      any:
        - { field: actor.roles, op: contains, value: org-admin }
        - { field: actor.roles, op: contains, value: operator }
        - { field: actor.roles, op: contains, value: auditor }
        - { field: actor.roles, op: contains, value: billing-manager }
    effect: ALLOW
fallback: DENY
