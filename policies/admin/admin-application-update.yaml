id: admin-application-update
version: 1
priority: 80
match:
  action: admin.application.update
  resource_type: application
rules:
  - name: deny-foreign-agent
    when:
      field: agent.id
      op: ne
      value: admin-mcp
    effect: DENY
    reason: Administration actions are bound to the admin-mcp agent
  - name: allow-entitled-roles
    when:
      any:
        - { field: actor.roles, op: contains, value: org-admin }
        - { field: actor.roles, op: contains, value: operator }
    effect: ALLOW
fallback: DENY
