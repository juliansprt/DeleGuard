id: llm-embed-production
version: 1
priority: 100
match:
  action: llm.embed
  resource_type: model
rules:
  - name: deny-unknown-model
    when:
      field: resource.attributes.in_catalog
      op: eq
      value: false
    effect: DENY
    reason: Embedding model is not in the organization catalog
  - name: deny-over-budget
    when:
      field: resource.attributes.over_budget
      op: eq
      value: true
    effect: DENY
    reason: Estimated cost exceeds remaining monthly budget
  - name: allow-catalog-embed
    when:
      all:
        - { field: resource.attributes.in_catalog, op: eq, value: true }
        - { field: resource.attributes.model_tier, op: eq, value: embed }
    effect: ALLOW
fallback: DENY
